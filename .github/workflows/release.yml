# Builds a release when a version tag (v1.2.3) is pushed:
# tests, publish, Velopack setup and update packages, upload to GitHub Releases.
# The release notes come from the matching section in CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Release notes from changelog
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## \[' + [regex]::Escape($env:VERSION) + '\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)'
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success -or -not $match.Groups[1].Value.Trim()) {
            throw "CHANGELOG.md has no section '## [$env:VERSION]'. Add it before tagging the release."
          }
          Set-Content release-notes.md $match.Groups[1].Value.Trim()

      - name: Test
        run: dotnet run --project tests/EdgeProfileManager.Tests -c Release

      - name: Publish
        run: dotnet publish src/EdgeProfileManager -c Release -r win-x64 --self-contained false -p:Version=$env:VERSION -o publish

      # vpk must match the Velopack package version used by the app.
      - name: Install vpk
        run: |
          $version = ([xml](Get-Content src/EdgeProfileManager/EdgeProfileManager.csproj)).Project.ItemGroup.PackageReference |
            Where-Object Include -eq 'Velopack' | Select-Object -ExpandProperty Version
          dotnet tool install -g vpk --version $version

      # Previous release for delta updates; there is none before the first release.
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl $env:REPO_URL --token ${{ secrets.GITHUB_TOKEN }} -o releases

      # No Velopack shortcuts: the app maintains its own Start menu shortcut with its AppUserModelID.
      - name: Pack
        run: >
          vpk pack -u EdgeProfileManager -v $env:VERSION -p publish -e EdgeProfileManager.exe -o releases
          -r win-x64 --framework net10.0-x64-desktop
          --packTitle "Edge Profile Manager" --packAuthors "Brassel IT"
          -i src/EdgeProfileManager/Assets/app.ico --shortcuts "" --releaseNotes release-notes.md

      - name: Upload release
        run: >
          vpk upload github --repoUrl $env:REPO_URL --token ${{ secrets.GITHUB_TOKEN }} -o releases
          --publish --releaseName "Edge Profile Manager $env:VERSION" --tag ${{ github.ref_name }}
